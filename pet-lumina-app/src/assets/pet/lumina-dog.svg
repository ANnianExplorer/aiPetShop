<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="A happy shiba dog">
  <defs>
    <linearGradient id="dogBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C38D" />
      <stop offset="100%" stop-color="#DEA163" />
    </linearGradient>
    <linearGradient id="dogHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2C894" />
      <stop offset="100%" stop-color="#E4AE70" />
    </linearGradient>
  </defs>

  <!-- tail -->
  <g>
    <path d="M143 197 C178 202 194 180 185 158 C177 139 158 141 155 154 C152 166 168 171 172 159" fill="none" stroke="#DEA163" stroke-width="17" stroke-linecap="round" />
    <circle cx="172" cy="159" r="8" fill="#FFF4E2" />
  </g>

  <!-- body -->
  <path d="M100 116 C72 116 57 145 53 181 L51 211 Q51 223 65 223 H135 Q149 223 149 211 L147 181 C143 145 128 116 100 116 Z" fill="url(#dogBody)" stroke="#C98B55" stroke-width="2.5" />
  <ellipse cx="100" cy="190" rx="35" ry="31" fill="#FFF4E2" opacity="0.97" />
  <path d="M61 166 Q69 171 67 181 M139 166 Q131 171 133 181" fill="none" stroke="#C98B55" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />

  <!-- paws -->
  <ellipse cx="78" cy="225" rx="15" ry="8" fill="#FFF4E2" stroke="#C98B55" stroke-width="2" />
  <ellipse cx="122" cy="225" rx="15" ry="8" fill="#FFF4E2" stroke="#C98B55" stroke-width="2" />
  <path d="M74 221 V228 M82 221 V228 M118 221 V228 M126 221 V228" stroke="#E2C09B" stroke-width="1.5" stroke-linecap="round" />

  <!-- collar -->
  <path d="M69 133 Q100 146 131 133 L133 146 Q100 159 67 146 Z" fill="#6FAE93" />
  <circle cx="100" cy="155" r="7.5" fill="#F2C94C" stroke="#D9A62E" stroke-width="1.8" />
  <path d="M97.5 153 H102.5 M100 155.5 V158" stroke="#B9851C" stroke-width="1.4" stroke-linecap="round" />

  <!-- head -->
  <circle cx="100" cy="83" r="59" fill="url(#dogHead)" stroke="#C98B55" stroke-width="2.5" />

  <!-- ears -->
  <path d="M55 45 L38 9 L90 29 Z" fill="#E4AE70" stroke="#C98B55" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M57 41 L46 19 L79 31 Z" fill="#FFF4E2" />
  <path d="M145 45 L162 9 L110 29 Z" fill="#E4AE70" stroke="#C98B55" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M143 41 L154 19 L121 31 Z" fill="#FFF4E2" />

  <!-- face blaze -->
  <path d="M100 29 C89 46 87 60 92 72 L108 72 C113 60 111 46 100 29 Z" fill="#FFF4E2" opacity="0.9" />

  <!-- eyes -->
  <g>
    <ellipse cx="78" cy="84" rx="12" ry="14" fill="#3A2A22" />
    <circle cx="73.5" cy="78" r="4.5" fill="#FFFFFF" />
    <circle cx="82" cy="89" r="2" fill="#FFFFFF" opacity="0.85" />
    <circle cx="78" cy="64" r="3.4" fill="#FFF4E2" />
  </g>
  <g>
    <ellipse cx="122" cy="84" rx="12" ry="14" fill="#3A2A22" />
    <circle cx="117.5" cy="78" r="4.5" fill="#FFFFFF" />
    <circle cx="126" cy="89" r="2" fill="#FFFFFF" opacity="0.85" />
    <circle cx="122" cy="64" r="3.4" fill="#FFF4E2" />
  </g>

  <!-- blush -->
  <ellipse cx="57" cy="100" rx="10" ry="5.5" fill="#F2A7A0" opacity="0.55" />
  <ellipse cx="143" cy="100" rx="10" ry="5.5" fill="#F2A7A0" opacity="0.55" />

  <!-- muzzle -->
  <ellipse cx="87" cy="102" rx="17" ry="14" fill="#FFF4E2" />
  <ellipse cx="113" cy="102" rx="17" ry="14" fill="#FFF4E2" />
  <ellipse cx="100" cy="93" rx="8" ry="6" fill="#4A3428" />
  <path d="M100 99 V105 M100 105 Q92 111 88 105 M100 105 Q108 111 112 105" fill="none" stroke="#7A4B3A" stroke-width="2" stroke-linecap="round" />

  <!-- tongue -->
  <path d="M93 110 Q100 107 107 110 Q108 121 100 122 Q92 121 93 110 Z" fill="#F28C8C" stroke="#D97070" stroke-width="1.5" />
  <path d="M100 111 V119" stroke="#D97070" stroke-width="1.2" stroke-linecap="round" />

  <!-- whiskers -->
  <path d="M52 100 L70 102 M50 109 L70 108 M148 100 L130 102 M150 109 L130 108" stroke="#C98B6B" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
</svg>
