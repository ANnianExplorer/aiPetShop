name: agent-ci

on:
  push:
    # 只跟 main：打标签也会触发 push 事件，那样同一个提交会被跑两遍（而且会让提交显示成红色）
    branches:
      - main
    paths:
      - "backend-agent/**"
      - ".github/workflows/agent-ci.yml"
  pull_request:
    paths:
      - "backend-agent/**"
      - ".github/workflows/agent-ci.yml"

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend-agent

jobs:
  check:
    name: lint + test + evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-agent/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest

      - name: Evals (hard thresholds)
        run: python -m evals.run

  image:
    name: docker build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # 构建上下文用 "."：本 job 的工作目录已经被 defaults 设成 backend-agent，
        # 再写一遍 backend-agent 会变成 backend-agent/backend-agent（不存在）。
        run: docker build -t pet-agent:ci .
