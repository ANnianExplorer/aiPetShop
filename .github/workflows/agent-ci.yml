name: agent-ci

on:
  push:
    paths:
      - "backend-agent/**"
      - ".github/workflows/agent-ci.yml"
  pull_request:
    paths:
      - "backend-agent/**"
      - ".github/workflows/agent-ci.yml"

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend-agent

jobs:
  check:
    name: lint + test + evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-agent/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest

      - name: Evals (hard thresholds)
        run: python -m evals.run

  image:
    name: docker build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pet-agent:ci backend-agent
