server:
  port: 8080

spring:
  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/petlumina?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: yzh521
  application:
    name: pet-backend
  servlet:
    multipart:
      # 文件上传最大限制
      max-file-size: 10MB
      # 整个请求的最大大小  Spring Boot 默认的文件上传限制就是 1MB
      max-request-size: 10MB

  # Redis
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  # 配置session
  session:
    store-type: redis
    timeout: 360000

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# Sa-Token
sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 腾讯云 COS
cos:
  secretId: ${COS_SECRET_ID}
  secretKey: ${COS_SECRET_KEY}
  bucket: ${COS_BUCKET}
  region: ${COS_REGION}
  host: ${COS_HOST}

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
