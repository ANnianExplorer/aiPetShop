server:
  port: 8080

spring:
  # 本地私有配置（数据库口令等），可选：文件不存在也能启动。
  # 仓库里不放任何真实口令；拷贝 application-local.yml.example 改成本地文件即可。
  config:
    import: optional:file:./application-local.yml
  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PETLUMINA_DB_URL:jdbc:mysql://localhost:3306/petlumina?useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${PETLUMINA_DB_USERNAME:${petlumina.db.username:root}}
    # 口令只从环境变量或 application-local.yml 读，默认空字符串。
    # 注意：HikariCP 是懒连接，缺口令时应用仍能启动，但第一次查库会报
    # `Access denied for user 'root'@'localhost' (using password: NO)`——这是预期行为，
    # 比"仓库里放一个明文口令、上线忘了改"要安全得多。
    password: ${PETLUMINA_DB_PASSWORD:${petlumina.db.password:}}
  application:
    name: pet-backend
  servlet:
    multipart:
      # 文件上传最大限制
      max-file-size: 10MB
      # 整个请求的最大大小  Spring Boot 默认的文件上传限制就是 1MB
      max-request-size: 10MB

  # Redis
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  # 配置session
  session:
    store-type: redis
    timeout: 360000

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# Sa-Token
sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 腾讯云 COS
cos:
  secretId: ${COS_SECRET_ID}
  secretKey: ${COS_SECRET_KEY}
  bucket: ${COS_BUCKET}
  region: ${COS_REGION}
  host: ${COS_HOST}

# 业务自定义配置
petlumina:
  auth:
    # 仅本地开发 / 自动化测试使用：验证码固定为 123456（本项目未接入短信网关）。
    # 生产环境不要配置此项，留空即生成随机 6 位验证码。
    fixed-verify-code: "123456"

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
